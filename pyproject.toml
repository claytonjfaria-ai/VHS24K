[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vhs24k"
version = "0.1.0"
description = "VHS/DVD to 4K restoration and upscaling pipeline using FFmpeg and Real-ESRGAN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["vhs24k*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
